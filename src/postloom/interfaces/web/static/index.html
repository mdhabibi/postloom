<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>postloom</title>
  <script src="/static/theme.js"></script>
  <link rel="preload" href="/static/fonts/Geist-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <header class="topbar">
      <a class="wordmark" href="#/" aria-label="postloom home">
        <svg class="wordmark-mark" viewBox="0 0 24 24" aria-hidden="true"><use href="/static/icon.svg#loom"/></svg>
        postloom
      </a>
      <button class="icon-button" type="button" id="menu-toggle" aria-expanded="false" aria-controls="sidebar" aria-label="Menu"></button>
    </header>

    <aside class="sidebar" id="sidebar" aria-label="Library">
      <a class="wordmark" href="#/" aria-label="postloom home">
        <svg class="wordmark-mark" viewBox="0 0 24 24" aria-hidden="true"><use href="/static/icon.svg#loom"/></svg>
        postloom
      </a>

      <button class="search-trigger" type="button" id="search-trigger" aria-haspopup="dialog">
        <span class="search-trigger-label">Search or ask</span>
        <kbd id="shortcut-hint">Ctrl K</kbd>
      </button>

      <nav class="main-nav" aria-label="Main">
        <a href="#/" data-route="home">Home</a>
        <a href="#/library" data-route="library">Library</a>
        <a href="#/add" data-route="add">Add</a>
        <a href="#/graph" data-route="graph">Graph</a>
        <a href="#/people" data-route="people">People</a>
        <a href="#/mentions" data-route="mentions">Mentions</a>
        <a href="#/settings" data-route="settings">Settings</a>
      </nav>

      <nav class="threads" aria-label="Topics">
        <h2 class="sidebar-heading">Topics</h2>
        <ul id="thread-list"></ul>
      </nav>

      <nav class="library" aria-label="Library">
        <h2 class="sidebar-heading">Recent writing</h2>
        <ul id="article-list"></ul>
      </nav>

      <div class="sidebar-foot">
        <div class="text-size" role="group" aria-label="Text size" id="text-size"></div>
        <button class="theme-toggle" type="button" id="theme-toggle"></button>
        <a class="theme-toggle about-link" href="#/about" data-route="about">About postloom</a>
        <button class="theme-toggle" type="button" id="quit" hidden></button>
      </div>
    </aside>

    <main id="main" tabindex="-1"></main>
  </div>

  <div class="palette-backdrop" id="palette" hidden>
    <div class="palette" role="dialog" aria-modal="true" aria-label="Search, ask or go to">
      <div class="palette-input">
        <input id="palette-input" type="text" autocomplete="off" spellcheck="false"
          placeholder="Search articles and people, ask a question, or go to a page"
          role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list">
        <kbd>Esc</kbd>
      </div>
      <ul class="palette-list" id="palette-list" role="listbox" aria-label="Results"></ul>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
