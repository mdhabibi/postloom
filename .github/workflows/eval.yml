# Measures how well postloom finds the sources for questions about a year of writing,
# with the real local embedding model: scripts/eval/run.py. Runs when the benchmark or
# the retrieval code changes, and on demand from the Actions tab. The report appears on
# the run's summary page and as a downloadable artifact.
name: Retrieval benchmark

on:
  push:
    paths:
      - "scripts/eval/**"
      - "src/postloom/application/use_cases/ask_question.py"
      - "src/postloom/application/use_cases/search_content.py"
      - "src/postloom/adapters/storage/search.py"
      - ".github/workflows/eval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - uses: actions/cache@v4
        with:
          path: .eval/models
          key: eval-models-bge-small-en-v1.5
      - name: Run the benchmark
        env:
          PYTHONPATH: .
        run: uv run python scripts/eval/run.py --embedder local --out .eval/out
      - run: cat .eval/out/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Compare strategies
        env:
          PYTHONPATH: .
        run: >-
          uv run python scripts/eval/compare.py --embedder local
          --rerankers Xenova/ms-marco-MiniLM-L-6-v2,jinaai/jina-reranker-v1-tiny-en
      - uses: actions/upload-artifact@v7
        with:
          name: retrieval-benchmark
          path: .eval/out/
