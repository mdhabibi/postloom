name: CI

# Pushes to main run lint and Linux tests only. The full matrix (macOS minutes count 10x
# and Windows 2x against a private repo's allowance) runs on pull requests, weekly, and
# on demand from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      # All three checks always run; each tool's full report is surfaced as one
      # annotation so it is readable on the run summary page without opening logs.
      - name: Ruff, format and Pyright
        run: |
          report() {
            if [ -s "$2" ]; then
              echo "::error title=$1::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$2")"
            fi
          }
          status=0
          uv run ruff check --output-format=concise . > ruff.txt 2>&1 || { status=1; report "ruff check" ruff.txt; }
          uv run ruff format --diff . > format.txt 2>&1 || { status=1; report "ruff format" format.txt; }
          uv run pyright > pyright.txt 2>&1 || { status=1; report "pyright" pyright.txt; }
          cat ruff.txt format.txt pyright.txt
          exit $status

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        python-version: ${{ fromJSON(github.event_name == 'push' && '["3.11", "3.13"]' || '["3.11", "3.12", "3.13"]') }}
        include:
          # Intel Macs and the newest Python: the install must work there too.
          - os: ${{ github.event_name == 'push' && 'ubuntu-latest' || 'macos-15-intel' }}
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      # On failure, the end of the report becomes an annotation on the run summary.
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest --cov=postloom --cov-report=term-missing -p no:cacheprovider 2>&1 | tee pytest.txt || {
            echo "::error title=pytest ${{ matrix.os }} ${{ matrix.python-version }}::$(tail -n 60 pytest.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          }

  local-embeddings:
    # Downloads the real local model once, tests it and reports its score ranges.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Local model tests
        run: RUN_LOCAL_MODEL_TESTS=1 uv run pytest tests/integration -q
      - name: Calibrate similarity cutoffs
        run: uv run python scripts/calibrate_embeddings.py
