name: Release

# Pushing a tag like v0.1.0 builds the package, checks it installs and runs, publishes it
# to PyPI and creates a GitHub release with the changelog's notes.
#
# Publishing uses PyPI's trusted publishing: no token is stored anywhere. Set it up once
# on pypi.org (Your account -> Publishing -> add a pending publisher) with
#   owner: mdhabibi, repository: postloom, workflow: release.yml, environment: pypi
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: The tag matches the version in pyproject.toml
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml"
            exit 1
          fi
      - name: The changelog has notes for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md || { echo "::error::No '## [${GITHUB_REF_NAME#v}]' section in CHANGELOG.md"; exit 1; }
      - run: uv build
      - name: The built package installs and runs
        run: |
          uvx --isolated --from dist/*.whl postloom --version
          uvx --isolated --from dist/*.whl postloom --home "$RUNNER_TEMP/home" init
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release with this version's changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^(## |\[[^]]+\]: )/ {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "postloom $version" --notes-file notes.md
