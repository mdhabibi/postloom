[project]
name = "postloom"
version = "0.1.0"
description = "Local-first knowledge graph and chat for your LinkedIn articles, posts, comments and the people behind them."
license = "FSL-1.1-ALv2"
dynamic = ["readme"]
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
authors = [{ name = "Mahdi Habibi" }]
keywords = ["knowledge-graph", "graph-rag", "rag", "linkedin", "local-first", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Local embeddings. ONNX Runtime ships no Intel macOS builds; there postloom uses the
    # provider's embeddings, or keyword search.
    "fastembed>=0.5; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "starlette>=0.40",
    "truststore>=0.10",
    "uvicorn>=0.30",
]

[project.scripts]
postloom = "postloom.interfaces.cli.main:main"

[project.urls]
Homepage = "https://github.com/mdhabibi/postloom"
Issues = "https://github.com/mdhabibi/postloom/issues"
Changelog = "https://github.com/mdhabibi/postloom/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "types-pyyaml>=6.0",
    "pre-commit>=3.7",
    "playwright==1.63.0",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

# The README links to screenshots and docs by relative path, which works on GitHub; on
# PyPI the same links need full URLs, so they are rewritten when the package is built.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\]\(|src=")(docs/images/)'
replacement = '\1https://raw.githubusercontent.com/mdhabibi/postloom/main/\2'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(([A-Z]+\.md)\)'
replacement = '](https://github.com/mdhabibi/postloom/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/postloom"]

[tool.hatch.build.targets.sdist]
exclude = [".github", "docs/images", ".pre-commit-config.yaml"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "TID",      # tidy imports
    "PTH",      # prefer pathlib
]
# Layer boundaries (domain <- application <- adapters/interfaces) are enforced
# by tests/architecture/test_layers.py.

[tool.ruff.lint.isort]
known-first-party = ["postloom", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "contract: tests every adapter of a port must pass",
]
